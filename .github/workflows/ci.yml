name: mobile-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: File length
        run: python3 scripts/check_line_limit.py
      - name: Docs are local-only
        run: python3 scripts/check_docs_not_tracked.py --allow-history
