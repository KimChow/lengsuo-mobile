[package]
name = "lengsuo-mobile-ffi"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Lengsuo project"]
description = "跨端链路协议栈的 Swift/Kotlin 绑定层：把 lengsuo-link-core 暴露为移动端可调用的稳定 ABI"

[lib]
name = "lengsuo_mobile_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# 跨端协议核心：固定 Git revision，不引用本地相对路径。
# ⚠️ 该仓的 crates/lengsuo-link-core 当前仍是占位实现（协议帧编解码在另卡进行中）。
lengsuo-link-core = { git = "https://github.com/KimChow/lengsuo-network.git", rev = "9b4e7aa86476acc4a697d2f1fbf8c090987f6922" }
thiserror = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = 0
